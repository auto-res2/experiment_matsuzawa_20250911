[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-experiments"
version = "0.1.0"

# We intentionally pin *CPU* wheels of torch/torch-geometric so the CI runner
# does not download massive CUDA binaries.  These versions are sufficient for
# the lightweight training loop implemented in `src/train.py`.

dependencies = [
  "torch==2.2.2+cpu; platform_system!='Darwin' and platform_machine!='arm64' and extra == ''",
  "torch_geometric==2.6.1",
  "torchdiffeq>=0.2.3",
  "flwr>=1.5.0",
  "opacus>=1.5.0",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "datasets>=2.18.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "numpy>=1.24.0"
]
