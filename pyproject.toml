[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-experiments"
version = "0.1.0"

# We intentionally depend on the *default* PyPI wheels so that uv/pip can
# resolve them without the need for an extra index.  The CPU-only variant
# (`+cpu`) caused resolution failures on the CI runner because those wheels are
# hosted on the PyTorch index rather than on PyPI.

dependencies = [
  "torch==2.2.2",
  "torch_geometric==2.6.1",
  "torchdiffeq>=0.2.3",
  "flwr>=1.5.0",
  "opacus>=1.5.0",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "datasets>=2.18.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "numpy>=1.24.0"
]
