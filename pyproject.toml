[project]
name = "adaptive-probability-flow"
version = "0.1.0"
description = "Refactored APF experimental pipeline"
requires-python = ">=3.11"
authors = [
    { name = "Adaptive Probability-Flow Experiments" }
]

# -----------------------------------------------------------------------------
#  Runtime dependencies – kept minimal to satisfy the refactor requirements
# -----------------------------------------------------------------------------
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "datasets>=2.14.0",
    "tqdm>=4.64.0",
    "requests>=2.28.0",
    "PyYAML>=6.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
# Example extras group; extend as required
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0"
]
