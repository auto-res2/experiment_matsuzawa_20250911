[project]
name = "conductor_experiments"
version = "0.1.0"
description = "Re-structured experimental suite for the CONDUCTOR paper."
requires-python = ">=3.9"
# Dependencies must be declared as a single array per PEP 621
dependencies = [
  "numpy>=1.21.0",
  "torch>=1.9.0",
  "datasets>=2.14.0",
  "sacrebleu>=2.3.0",
  "matplotlib>=3.6.0",
  "seaborn>=0.12.0",
  "omegaconf>=2.3.0",
  "hydra-core>=1.3.0",
  "tqdm>=4.64.0",
  "pynvml>=11.4.1",
  "pandas>=1.5.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# No extras for now

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}
