[project]
name = "hydrasketch_phi_experiment"
version = "0.1.0"
description = "Research code for HydraSketch-Φ continual-learning experiments"
requires-python = ">=3.9"
# ------------------------------------------------------------------
# Core, *always* needed dependencies.  Heavy ML libraries like Torch are
# intentionally excluded because the CI stub never touches them.
# ------------------------------------------------------------------
dependencies = [
    "requests>=2.25.0",
    "tqdm>=4.60.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Reserved for future, full-scale runs only.
full = [
    "torch>=1.9.0",
]