[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "common-core-experiment"
version = "0.1.1"
requires-python = ">=3.8"
dependencies = [
    "torch>=1.13.0",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.12.0",
    "tqdm>=4.64.0",
    "PyYAML>=6.0",
    "transformers>=4.33.0",
    "datasets>=2.14.0"
]

[tool.setuptools]
packages = ["src"]
