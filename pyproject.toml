[project]
name = "mnist_cnn_experiment"
version = "0.1.0"
requires-python = ">=3.8"
dependencies = [
  "torch>=1.9.0",
  "torchvision>=0.10.0",
  "numpy>=1.21.0",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "scikit-learn>=0.24.0",
  "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
