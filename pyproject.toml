[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-experiments"
version = "0.1.0"

# Strict dependency versions to avoid NumPy 2.x incompatibilities.

dependencies = [
  "torch==2.2.2",
  "torch_geometric==2.6.1",
  "torchdiffeq>=0.2.3",
  "flwr>=1.5.0",
  "ray>=2.9.0",                # Added for flwr.simulation support
  "opacus>=1.5.0",
  "matplotlib>=3.4.0,<3.11",  # matplotlib 3.11+ may require NumPy 2
  "seaborn>=0.11.0,<0.14",
  "datasets>=2.18.0,<3.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "numpy<2.0",            # hard upper-bound to keep compiled wheels compatible
  "pandas<2.2",            # pandas 2.2+ requires NumPy 2.x
]
