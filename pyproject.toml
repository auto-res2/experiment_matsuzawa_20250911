[project]
name = "cafe_edge_repro"
version = "0.1.0"

# ----------------------------------------------------------------------------
# Dependency policy
# ----------------------------------------------------------------------------
# 1. Use an officially published PyTorch wheel available on PyPI so that the
#    resolver can always find a satisfiable version in the default index.
# 2. NumPy is pinned to the latest 1.x series because many binary wheels in the
#    PyData ecosystem (and, critically, torch-geometric) are still built
#    against the NumPy 1.x C-ABI.  NumPy 2.x causes import-time failures for
#    those wheels.
# ----------------------------------------------------------------------------

dependencies = [
  # PyTorch – standard wheel from PyPI (CPU-only by default).
  "torch>=2.2.0,<2.3.0",

  # torch-geometric is optional; the runtime stub covers unsupported platforms.
  "torch-geometric>=2.2.0,<2.6.0",

  # **Critical ABI pin** – stay on NumPy 1.x.
  "numpy>=1.22.0,<2.0.0",

  # Data / plotting stack
  "pandas>=1.3.0",
  "pyarrow>=6.0.0",
  "matplotlib>=3.4.0",

  # Misc utilities
  "requests>=2.26.0",
  "PyYAML>=6.0"
]
