[project]
name = "hydrasketch_phi_experiment"
version = "0.1.1"
description = "Research code for HydraSketch-Φ continual-learning experiments (CI edition)"
requires-python = ">=3.9"
# ------------------------------------------------------------------
# Core dependencies – heavy ML libs intentionally excluded so that the
# analytical CI path remains lightweight.
# ------------------------------------------------------------------
dependencies = [
    "requests>=2.25.0",
    "tqdm>=4.60.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Reserved for full-scale hardware runs.
full = [
    "torch>=1.9.0",
]