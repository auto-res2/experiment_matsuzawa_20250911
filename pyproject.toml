[project]
name = "hyper_waveguard"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.21.0",
  "torch>=1.9.0",
  "dgl>=1.1.0",
  "ogb>=1.3.6",
  "pyyaml>=6.0",
  "matplotlib>=3.5.0",
  "seaborn>=0.11.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
