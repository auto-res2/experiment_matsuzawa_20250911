[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro-experiments"
version = "0.1.0"

dependencies = [
  "torch>=1.9.0",
  "torch_geometric>=2.4.0",
  "torchdiffeq>=0.2.3",
  "flwr>=1.5.0",
  "opacus>=1.5.0",
  "matplotlib>=3.4.0",
  "seaborn>=0.11.0",
  "datasets>=2.18.0",
  "pyyaml>=6.0",
  "requests>=2.31.0"
]
