[project]
name = "tiny-taco"
version = "0.1.0"
description = "Refactored TinyTACO continual-learning baseline"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.14.0",
    "torchaudio>=0.14.0",
    "timm>=0.9.2",
    "transformers>=4.36.0",
    "datasets>=2.14.0",
    "huggingface_hub>=0.17.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
