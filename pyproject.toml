[project]
name = "iteration8-experiments"
version = "0.1.0"
description = "Executable reproduction of the three-experiment TACO study"
authors = [
  { name = "OpenAI-Autogenerated", email = "noreply@example.com" },
]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Apache-2.0" }

# -------------------------- Runtime deps ---------------------------
# Keeping the list minimal to reduce cold-boot cost -----------------
dependencies = [
  "numpy>=1.20",
  "torch>=1.13",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
  "tqdm>=4.65",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
