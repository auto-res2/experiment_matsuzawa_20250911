[project]
name = "conductor-experiments"
version = "0.1.0"
description = "CONDUCTOR experimental codebase"
authors = [
    { name = "Researcher", email = "research@example.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"

# -----------------------------------------------------------------------------
# Dependencies – keep the list minimal; add new entries if future fixes require
# additional libraries.  Ensure absence of circular dependencies.
# -----------------------------------------------------------------------------
dependencies = [
    "matplotlib>=3.8",
    "huggingface_hub>=0.20",
    "pynvml>=11.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"