[tool.poetry]
name = "squad-dialo-experiment"
version = "0.2.0"
description = "Specialised experiment: SQuAD → answer-length classification with DialoGPT backbone"
authors = ["AI Researcher <ai@researcher.org>"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
torch = "^2.2"
transformers = "^4.40"
datasets = "^3.8"
matplotlib = "^3.8"
seaborn = "^0.13"
scikit-learn = "^1.4"
pyyaml = "^6.0"
numpy = "^1.26"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
