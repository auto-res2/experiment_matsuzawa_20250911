[project]
name = "iris_experiment"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9"

# Mandatory dependencies – pinned to reasonably recent versions compatible with CPU runtime
dependencies = [
  "numpy>=1.19.0",
  "torch>=1.9.0",
  "matplotlib>=3.3.0",
  "scikit-learn>=0.24.0",
  "PyYAML>=5.4.0",
  "requests>=2.25.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
