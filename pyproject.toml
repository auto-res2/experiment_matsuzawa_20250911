[project]
name = "taco-edge-learning"
version = "0.1.0"
description = "Refactored experimental pipeline for TACO continual learning (512-byte memory)."
requires-python = ">=3.9"

# Dependencies must be a simple array – static validation enforces this format
dependencies = [
    "datasets>=2.16.0",
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "transformers>=4.38.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=65.5.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
