[project]
name = "hydrasketch_phi"
version = "0.1.0"
description = "Refactored HydraSketch-Φ continual-learning research suite"
dependencies = [
    "numpy>=1.21.0",
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "PyYAML>=5.4.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "scikit-learn>=0.24.0",
    "requests>=2.25.0",
    "tqdm>=4.60.0",
    "transformers>=4.30.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
