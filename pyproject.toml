[project]
name = "cafe_edge_repro"
version = "0.1.0"
dependencies = [
  # Pinned to <2.3 to avoid the new NVIDIA meta-package dependencies that break
  # CPU-only CI runners.
  "torch>=1.12.0,<2.3",
  # torch-geometric wheels for pure-python environments are optional; a stub is
  # injected at runtime if the import fails, so we keep it optional here.
  "torch-geometric>=2.2.0,<2.6.0",
  "numpy>=1.21.0",
  "pandas>=1.3.0",
  "pyarrow>=6.0.0",
  "matplotlib>=3.4.0",
  "requests>=2.26.0",
  "PyYAML>=6.0"
]
