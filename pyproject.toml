[project]
name = "raptor-experiment"
version = "0.1.0"
description = "Lightweight scaffold for RAPTOR diffusion experiments"
requires-python = ">=3.9"

# Mandatory runtime dependencies kept minimal to speed up CI installations.
dependencies = [
    "numpy>=1.21",
    "torch>=1.13",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
