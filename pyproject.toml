[project]
name = "phoenix_mem_minimal"
version = "0.1.0"
description = "Refactored, self-contained subset of the PHOENIX-Mem experimental suite"
# PEP-621 requires *array of tables* for authors
authors = [
  { name = "OpenAI ChatGPT", email = "noreply@example.com" }
]
readme = "README.md"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
full = [
  "numpy>=1.21.0",
  "torch>=1.9.0",
  "requests>=2.31.0",
  "PyYAML>=6.0",
]
