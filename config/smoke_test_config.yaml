# Quick validation – 2 rounds / 1 epoch / small device pool

global:
  seed_list: [11]
  num_gpus: 1          # only need a single GPU for smoke test
  device_world_size: 20
  figure_dir: ".research/iteration1/images"
  result_dir: ".research/iteration1"

datasets:
  tiny_imagenet:
    hf_repo: "slegroux/tiny-imagenet-200-clean"
    img_size: 64
    num_tasks: 2       # only 2 tasks for a fast check
    classes_per_task: 10

models:
  backbone:
    name: "mobilenet_v2"
    width_mult: 0.5
    pretrained: false
  memory:
    hermes:
      num_keys: 1024
      dim: 128
    holozip: {num_keys: 1024}
    grail:   {num_keys: 1024}

train:
  batch_size: 16
  epochs_local: 1
  rounds: 2
  lr: 0.02
  lr_decay: 0.98
