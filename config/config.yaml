version: 1
experiment:
  exp1:
    memory_budget_bytes: 512
    drift_alpha: 0.002
    label_noise: 0.2
    eval_interval_min: 10
    seeds: 5
    hyperparams:
      lr: [1e-4, 3e-4, 1e-3]
      probe_tau: [0.05, 0.1, 0.2]
      lora_rank: [1, 2, 4]
      bloom_bits: [32, 48, 64]
  exp2:
    epsilon_target: 1.0
    delta: 1e-6
    replay_times: 1024
  exp3:
    memory_sweep: [256, 512, 1024, 2048]
    devices: ["Cortex-M55", "Raspberry-Pi5", "Pixel-8a"]
