# Default configuration for HydraSketch-Φ experiments

dataset_url: https://edgebench.org/datasets/edgebench-48-v1.2.tar
dataset_archive: data/edgebench-48-v1.2.tar
dataset_root: data/edgebench-48

vision_backbone: microsoft/resnet-18
radar_backbone: pointnet
gas_radiation_backbone: gru128
ecg_backbone: resnet1d-10

lr: 0.0003
weight_decay: 0.0001
batch_size: 128
epochs: 300

alpha: 0.5
teleport_delta_bits: 1.0
latency_deadline_ms: 30
ram_cap_mb: 0.05

num_workers: 8
seeds:
  - 0
  - 1
  - 2
