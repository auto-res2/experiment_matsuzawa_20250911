hardware:
  gpu: "NVIDIA A100 x8"
  vram: "80GB x8"
  ram: "2TB"
experiments:
  exp1:
    name: vision_adaptivity
    source_dataset:
      hf_id: cifar10       # switched to public dataset to avoid gated access
    target_dataset:
      hf_id: albertvillanova/medmnist-v2
      config: pathmnist
    model: stabilityai/stable-diffusion-xl-base-1.0
    hyper:
      pretrain_steps: 500000
      finetune_epochs: 3
      batch_size: 128
      lr: 0.0001
      hutch_sketch: 2048
      hutch_topk: 128
      hutch_refresh: 256
      tau_grid: [0.005, 0.01, 0.015, 0.03, 0.05]
  exp2:
    name: text_scalability
    dataset_url: https://huggingface.co/datasets/stackoverflow-must-have/stackoverflow-2023
    vocab_size: 80000
    model: morissu/camelot
    hyper:
      num_sequences: 100000
      n_gpu_grid: [1, 2, 4, 8]
      governor_weights:
        time: 1.0
        gpu_j: 0.2
        mem_j: 0.5
  exp3:
    name: genomics_federated
    dataset_url: https://huggingface.co/datasets/human_ensembl_genome/gpt
    clients: 10000
    model: morissu/camelot
    hyper:
      rank: 32
      epsilon_adv: 1
      round_limit: 250
