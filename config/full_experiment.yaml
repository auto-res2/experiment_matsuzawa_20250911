experiment_name: iris_full

dataset:
  url: https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data
  local_path: data/iris/iris.data
  val_split: 0.15
  test_split: 0.15

model:
  input_dim: 4
  hidden_dims: [16, 12]
  output_dim: 3

training:
  batch_size: 16
  epochs: 100  # full training run
  learning_rate: 0.001
  seed: 42
