# config/full_experiment.yaml – Specialized SQuAD → DialoGPT causal-LM finetune
experiment:
  name: squad_dialogpt

seed: 42

dataset:
  name: squad
  max_length: 128          # tokenizer sequence length
  train_size: 1000         # keep tiny to respect 500 MB / CPU limits
  val_size: 200
  test_size: 200
  batch_size: 8            # small batch for CPU memory
  num_workers: 0

model:
  type: dialogpt-medium     # will trigger transformers AutoModelForCausalLM

optimizer:
  lr: 5e-5                 # standard LM fine-tune LR
  weight_decay: 0.01

scheduler:
  step_size: 5

training:
  epochs: 1                # single epoch demo due to resources
