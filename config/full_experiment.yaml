experiment_name: mnist_cnn_full
seed: 42

dataset:
  name: MNIST
  url: "http://yann.lecun.com/exdb/mnist/"
  root: data/
  download: true
  train_subset: null
  val_subset: 5000

model:
  name: SimpleCNN
  input_channels: 1
  num_classes: 10

training:
  batch_size: 64
  epochs: 10
  learning_rate: 0.001
  weight_decay: 0.0
  lr_scheduler:
    name: StepLR
    step_size: 5
    gamma: 0.5

evaluation:
  metrics: [accuracy, loss]
