# config/full_experiment.yaml
# Fully-specified configuration (no placeholders!)

experiment_name: squad_answer_length
save_dir: artifacts

dataset:
  name: squad
  max_length: 64        # tokenizer sequence length
  num_classes: 3        # short / medium / long answers

model:
  name: microsoft/DialoGPT-medium  # HF backbone to be wrapped for classification

training:
  epochs: 3           # kept small to respect RAM/CPU envelope
  batch_size: 8       # fits into 500 MB when using DialoGPT-medium + FP32
  lr: 2e-5            # standard fine-tuning LR for transformers
  seed: 1234
