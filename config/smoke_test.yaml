experiment_name: iris_smoke

# Data-set parameters
dataset:
  url: https://archive.ics.uci.edu/ml/machine-learning-databases/iris/iris.data
  local_path: data/iris/iris.data
  val_split: 0.15
  test_split: 0.15

# Model architecture
model:
  input_dim: 4
  hidden_dims: [8]
  output_dim: 3

# Training hyper-parameters
training:
  batch_size: 16
  epochs: 5  # minimal epochs for smoke validation
  learning_rate: 0.01
  seed: 42
