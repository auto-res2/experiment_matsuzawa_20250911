experiment_name: mnist_cnn_smoke
seed: 42

dataset:
  name: MNIST
  url: "http://yann.lecun.com/exdb/mnist/"
  root: data/
  download: true
  train_subset: 1000
  val_subset: 200

model:
  name: SimpleCNN
  input_channels: 1
  num_classes: 10

training:
  batch_size: 64
  epochs: 1
  learning_rate: 0.001
  weight_decay: 0.0
  lr_scheduler:
    name: null

evaluation:
  metrics: [accuracy, loss]
